<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARBO AUDIT ALGERIA — Bilan carbone ISO 14064-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&amp;family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js';document.head.appendChild(s);"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --paper:#F2EDE0; --card:#FCFAF3; --card2:#F7F3E7; --ink:#20261F; --ink2:#5A6156; --ink3:#8B9083;
  --line:#DCD5C0; --line2:#E8E2D2;
  --green:#1E5B44; --green2:#2E7556; --green-ink:#14241C; --green-soft:#E2EBE1; --green-line:#BFCFC0;
  --amber:#A5631C; --amber-bg:#F6E7CC; --amber-line:#E3C795;
  --danger:#9C3A2A; --danger-bg:#F3E0DB;
  --serif:'Fraunces',Georgia,serif; --sans:'Archivo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
::selection{background:#CFE0CE}
#app{display:flex;min-height:100vh}
#sidebar{width:236px;flex:none;background:var(--green-ink);color:#C8CFC2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:26px 22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-row{display:flex;gap:12px;align-items:center}
.brand-mark{width:42px;height:42px;flex:none;background:linear-gradient(150deg,#2E7556,#1E5B44);border-radius:10px;display:grid;place-items:center;color:#F2EDD9;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand h1{font-family:var(--serif);font-size:16.5px;font-weight:600;color:#F2EDD9;line-height:1.2;letter-spacing:.02em}
.brand small{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7E8F7E}
nav{padding:14px 12px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:#B9C2B4;font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.nav-item i{width:18px;text-align:center;font-size:14px;color:#7E8F7E;transition:color .15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#F2EDD9}
.nav-item.on{background:rgba(255,255,255,.09);color:#F5F1E3;box-shadow:inset 2px 0 0 #8FD0A8}
.nav-item.on i{color:#8FD0A8}
#secBtn i{color:#C8A25F}
.side-foot{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7E8F7E;line-height:1.6}
.side-foot b{color:#AEBBA9;font-weight:600}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:rgba(242,237,224,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 34px;display:flex;align-items:baseline;gap:10px}
#crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
#crumb b{color:var(--green)}
#view{padding:30px 34px 70px;max-width:1180px;width:100%}
h2.pg{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.pg-sub{color:var(--ink2);margin-top:6px;max-width:70ch}
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px;flex-wrap:wrap}
.sec-h .n{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--amber);font-weight:500}
.sec-h h3{font-family:var(--serif);font-size:19px;font-weight:600}
.sec-h .r{margin-left:auto;font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green-ink);color:#F2EDD9;border:1px solid var(--green-ink);border-radius:9px;padding:9px 16px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--green)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--green-ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card);border-color:var(--ink3)}
.btn.warn{background:transparent;color:var(--danger);border-color:var(--danger-bg)}
.btn.warn:hover{background:var(--danger-bg)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
.ibtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);cursor:pointer;display:inline-grid;place-items:center;font-size:12.5px;transition:all .15s}
.ibtn:hover{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.ibtn.del:hover{color:var(--danger);border-color:#D8B4AB;background:var(--danger-bg)}
.inp,select.inp,textarea.inp{background:#FFFEF8;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:var(--sans);font-size:13.5px;color:var(--ink);width:100%;transition:border .15s,box-shadow .15s}
.inp:focus{outline:0;border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,117,86,.14)}
label.f{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.fgrid .full{grid-column:1/-1}
.metrics{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-top:22px;overflow:hidden}
.metric{padding:18px 26px;border-right:1px solid var(--line2);min-width:150px}
.metric:last-child{border-right:0}
.metric .v{font-family:var(--serif);font-size:31px;font-weight:600;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
.metric .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-top:7px;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.step{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.step .k{font-family:var(--serif);font-style:italic;color:var(--amber);font-size:15px;flex:none}
.step b{display:block;font-size:13.5px;margin-bottom:3px}
.step span{font-size:12.5px;color:var(--ink2)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.sgrid.big{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.scard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px 16px;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;gap:12px}
.scard:hover{transform:translateY(-3px);border-color:var(--green-line);box-shadow:0 16px 30px -20px rgba(32,38,31,.5)}
.sicon{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:2.15rem;box-shadow:inset 0 0 0 5px rgba(255,255,255,.16),0 6px 14px -8px rgba(0,0,0,.5)}
.sgrid.big .sicon{width:104px;height:104px;font-size:2.6rem}
.scard h4{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.25}
.scard .d{font-size:12.5px;color:var(--ink2);flex:1}
.scard .m{font-size:11px;color:var(--ink3);letter-spacing:.05em;border-top:1px solid var(--line2);padding-top:9px;display:flex;gap:12px}
.ahead{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;flex-wrap:wrap}
.ahead .sicon{width:72px;height:72px;font-size:1.8rem}
.ahead h2{font-family:var(--serif);font-size:24px;font-weight:600}
.ahead .d{color:var(--ink2);font-size:13px;margin-top:2px}
.ahead .acts{margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.chips{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);border-radius:999px;padding:2.5px 10px}
.chip.amb{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-line)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;border:0;background:none;margin-bottom:14px;padding:0;font-family:var(--sans)}
.back:hover{color:var(--green)}
.meta-box{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.ref-dossier{font-family:var(--serif);font-style:italic;color:var(--ink3);font-size:13px;word-break:break-word}
details.tcat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:visible}
details.tcat[open]{border-color:var(--green-line)}
details.tcat summary{list-style:none;display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;user-select:none;border-radius:12px}
details.tcat summary::-webkit-details-marker{display:none}
details.tcat summary:hover{background:var(--card2)}
.hex{width:36px;height:40px;flex:none;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#F2EDD9;font-weight:700;font-size:15px}
details.tcat summary b{font-family:var(--serif);font-size:15.5px;font-weight:600}
details.tcat summary .cnt{margin-left:auto;font-size:11.5px;color:var(--ink3);text-align:right}
details.tcat summary .chev{color:var(--ink3);font-size:12px;transition:transform .2s}
details.tcat[open] summary .chev{transform:rotate(180deg)}
.titems{padding:2px 16px 14px 20px}
.titem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:13px;flex-wrap:wrap}
.titem:last-child{border-bottom:0}
.titem::before{content:"";width:6px;height:6px;background:var(--green2);flex:none;border-radius:1px}
.titem .lbl{flex:1;min-width:200px}
.fechip{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:1px solid var(--green-line);color:var(--green);border-radius:999px;padding:2.5px 11px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.fechip:hover{background:#D3E2D2}
.fechip.gh{background:transparent;border-style:dashed;color:var(--ink3);border-color:var(--line)}
.fechip.gh:hover{color:var(--amber);border-color:var(--amber-line)}
.qcat{margin-bottom:26px}
.qcat-h{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:2px;flex-wrap:wrap}
.qcat-h b{font-family:var(--serif);font-size:16px;font-weight:600}
.qcat-h .qcat-meta{font-size:11.5px;color:var(--ink3);margin-left:auto}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 240px 130px;gap:18px;padding:15px 0;border-bottom:1px solid var(--line2);align-items:start}
.qrow .lft .qq{font-weight:600;font-size:13.5px;line-height:1.45}
.qrow .lft .qq .req{color:var(--amber);margin-left:4px}
.qrow .lft .fel{margin-top:7px;font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.answrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:#FFFEF8;overflow:hidden}
.answrap:focus-within{border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,117,86,.14)}
.answrap input,.answrap select{flex:1;min-width:0;border:0;background:transparent;padding:9px 12px;font-family:var(--sans);font-size:13.5px;color:var(--ink)}
.answrap input:focus,.answrap select:focus{outline:0}
.answrap .uu{flex:none;padding:0 12px 0 4px;font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.03em}
.dq-inp{margin-top:6px;font-size:11.5px;padding:5px 9px;border-radius:7px;border-color:var(--line2);color:var(--ink2);background:var(--card2)}
.res{font-size:13.5px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;text-align:right;padding-top:9px}
.res.off{color:var(--ink3);font-weight:400;font-size:12px}
.tip{position:relative;display:inline-flex;color:var(--ink3);cursor:help;margin-left:6px}
.tip i{font-size:12.5px}
.tip:hover{color:var(--amber)}
.tipbox{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-30%);width:290px;background:var(--green-ink);color:#E4E9DE;font-size:11.8px;line-height:1.55;padding:11px 13px;border-radius:9px;z-index:60;font-weight:400;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
.tipbox::after{content:"";position:absolute;top:100%;left:30%;border:7px solid transparent;border-top-color:var(--green-ink)}
.tip:hover .tipbox{display:block}
/* MENU DÉROULANT AU SURVOL (HOVER) — VIGILANCE DOUBLE COMPTAGE */
.dc-hover{position:relative;display:inline-flex;align-items:center}
.dc-badge{display:inline-flex;align-items:center;gap:6px;background:var(--amber-bg);border:1px solid var(--amber-line);color:var(--amber);border-radius:999px;padding:2.5px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.dc-badge:hover{background:var(--amber);color:#fff}
.dc-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;width:min(540px,86vw);background:var(--card);border:1px solid var(--amber-line);border-radius:12px;padding:12px 14px;z-index:80;box-shadow:0 18px 38px -12px rgba(20,26,20,.45);color:var(--ink);font-weight:400;text-align:left}
.dc-pop::before{content:"";position:absolute;top:-10px;left:0;right:0;height:10px}
.dc-hover:hover .dc-pop,.dc-pop:hover{display:block}
.dc-pop-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line2);padding-bottom:6px}
.dc-pop-item{padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12px;line-height:1.45}
.dc-pop-item:last-child{border-bottom:0;padding-bottom:2px}
.dc-pop-item b{color:var(--ink);display:block;margin-bottom:2px}
.dc-pop-item span{color:var(--ink2)}
.dc-jmp{display:inline-flex;align-items:center;gap:4px;background:#FFF8EB;border:1px solid var(--amber-line);color:var(--amber);border-radius:999px;padding:1.5px 8px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:4px;margin-right:4px;transition:all .15s}
.dc-jmp:hover{background:var(--amber);color:#fff}
/* ALARME DE SEUIL & DÉTECTION D'ANOMALIES */
.alrm{display:inline-flex;align-items:center;gap:7px;background:var(--amber-bg);border:1px solid var(--amber-line);color:#6E4511;font-size:11.3px;font-weight:600;padding:4px 10px;border-radius:8px;margin-top:6px;line-height:1.35;width:100%}
.alrm.red{background:var(--danger-bg);border-color:#D8B4AB;color:var(--danger)}
.alrm i{flex:none;font-size:12.5px}
/* CHECKLIST DOUBLE COMPTAGE */
.dc-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,background .15s}
.dc-card.ok{background:var(--green-soft);border-color:var(--green-line)}
.dc-card input[type=checkbox]{width:17px;height:17px;margin-top:2px;flex:none;cursor:pointer}
.dc-card .dc-b{flex:1;min-width:0}
.dc-card .dc-t{font-family:var(--serif);font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-card .dc-w{font-size:11.2px;color:var(--amber);font-weight:600;margin-top:1px}
.dc-card.ok .dc-w{color:var(--green)}
.dc-card .dc-r{font-size:12.2px;color:var(--ink2);margin-top:3px;line-height:1.45}
/* INTENSITÉ, BENCHMARK & ÉQUIVALENCES */
.int-bar{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:11px 14px;margin-top:14px;flex-wrap:wrap}
.int-bar label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#9CAF9C;font-weight:600}
.int-bar input{background:#FFFEF8;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px;width:150px;color:var(--ink);font-family:var(--sans)}
.int-res{margin-left:auto;font-family:var(--serif);font-size:19px;font-weight:600;color:#8FD0A8}
.bench-card{background:var(--card);border:1px solid var(--green-line);border-left:4px solid var(--green);border-radius:12px;padding:15px 18px;margin-top:14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.bench-card i{font-size:20px;color:var(--green);margin-top:2px}
.bench-card .bb{flex:1;min-width:240px}
.bench-card h4{font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--ink)}
.bench-card p{font-size:12.5px;color:var(--ink2);margin-top:3px}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.eq-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:13px;align-items:center}
.eq-ic{width:44px;height:44px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:18px;flex:none}
.eq-v{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums}
.eq-l{font-size:11.8px;color:var(--ink2);margin-top:2px;line-height:1.35}
.synth{background:var(--green-ink);border-radius:16px;padding:26px 28px;color:#DCE3D8}
.synth .tot{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.synth .tot .v{font-family:var(--serif);font-size:44px;font-weight:600;color:#F2EDD9;line-height:1;font-variant-numeric:tabular-nums}
.synth .tot .u{font-size:14px;color:#9CAF9C}
.synth .tot .p{margin-left:auto;font-size:12px;color:#9CAF9C}
.trac{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:#C3CCC0;flex-wrap:wrap}
.trac b{color:#F2EDD9}
.gbar{display:flex;height:13px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.12);margin:20px 0 14px}
.gbar div{height:100%;transition:width .4s}
.srows{display:grid;gap:9px}
.srow{display:grid;grid-template-columns:34px 1fr 150px 60px 130px;align-items:center;gap:10px;font-size:12.5px}
.srow .cd{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#F2EDD9}
.srow .tv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:#F2EDD9}
.srow .pct{text-align:right;color:#9CAF9C}
.srow .mb{height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.srow .mb i{display:block;height:100%;background:#8FD0A8}
.pblock{margin-top:14px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.ptitle{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.pieflex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.piewrap{position:relative;height:220px;flex:1;min-width:220px;max-width:320px}
.plegend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:220px;max-width:440px}
.plg{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;color:var(--ink2)}
.plg .dot{width:11px;height:11px;border-radius:3px;flex:none}
.plg em{font-style:normal;font-weight:700;color:var(--ink);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);background:var(--card2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#F5F1E4}
.tbl .mono{font-variant-numeric:tabular-nums;font-weight:600}
.tbl .inp{padding:7px 10px;font-size:12.8px}
.feb{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--ink2);white-space:nowrap}
.feb i{color:var(--amber);font-size:9.5px}
.pill{display:inline-grid;place-items:center;min-width:30px;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{width:auto}
.toolbar .sep{flex:1}
details.faq{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:15px 18px;user-select:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary b{font-family:var(--serif);font-size:15.5px;font-weight:600;flex:1}
details.faq summary i{color:var(--ink3);transition:transform .2s;font-size:12px}
details.faq[open] summary i{transform:rotate(180deg)}
details.faq[open] summary{border-bottom:1px solid var(--line2)}
details.faq .a{padding:15px 18px;color:var(--ink2);font-size:13.5px;line-height:1.7}
details.faq .a p+p{margin-top:9px}
.prose{max-width:78ch}
.prose p{margin-bottom:11px;color:var(--ink2);font-size:14px}
.prose p strong{color:var(--ink)}
.brow{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 18px;margin-bottom:9px;flex-wrap:wrap}
.brow .sicon{width:52px;height:52px;font-size:1.25rem}
.brow .bx{flex:1;min-width:0}
.brow b{font-family:var(--serif);font-size:15.5px;font-weight:600}
.brow .d{font-size:12px;color:var(--ink2)}
#modal,#printModal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(20,26,20,.55);backdrop-filter:blur(3px);padding:26px}
#modal.open,#printModal.open{display:flex}
.mcard{background:var(--paper);border-radius:16px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:26px 28px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.mcard h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.mcard .ms{font-size:12.5px;color:var(--ink2);margin-bottom:18px}
#printModal{align-items:stretch;justify-content:center;padding:26px 0}
.pwrap{background:#3A423A;width:min(860px,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.pacts{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#2C332C;color:#C6CEC0}
.pacts .t{font-size:12.5px;font-weight:600;margin-right:auto}
.pbody{overflow:auto;padding:22px;background:#4A524A}
.doc{background:#fff;color:#1A1D1A;width:100%;padding:38px 42px;font-family:var(--serif)}
.doc .dhead{display:flex;gap:14px;align-items:center;border-bottom:3px double #1A1D1A;padding-bottom:14px;margin-bottom:6px}
.doc .dmark{width:44px;height:44px;background:#1E5B44;border-radius:8px;display:grid;place-items:center;color:#F2EDD9;font-weight:600;font-size:16px}
.doc h1{font-size:20px;font-weight:700;line-height:1.2}
.doc .dsub{font-size:11px;font-family:var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#5A6156;margin-top:3px}
.doc .dmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px;font-family:var(--sans);font-size:11.5px;margin:16px 0 22px}
.doc .dmeta span{border-bottom:1px solid #9B9B8F;padding:4px 0 7px;color:#3C4038}
.doc .dmeta b{color:#1A1D1A}
.doc table{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:10.8px;margin:8px 0 20px}
.doc th{border:1px solid #6B6B60;background:#EFEAE0;padding:6px 8px;text-align:left;font-weight:700;font-size:9.6px;text-transform:uppercase;letter-spacing:.05em}
.doc td{border:1px solid #9B9B8F;padding:7px 8px;vertical-align:top}
.doc .cattitle{font-size:14.5px;font-weight:700;margin-top:20px;font-family:var(--serif)}
.doc .cattitle small{font-family:var(--sans);font-weight:400;color:#5A6156;font-size:10.5px}
.doc .dfoot{margin-top:26px;padding-top:12px;border-top:1px solid #9B9B8F;font-family:var(--sans);font-size:9.8px;color:#5A6156;line-height:1.6}
.doc .rsec{margin-top:22px}
.doc .rsec h2{font-size:14.5px;font-weight:700;margin:0 0 8px;border-bottom:1px solid #1A1D1A;padding-bottom:4px}
.doc .rsec p{font-family:var(--sans);font-size:11px;line-height:1.65;margin:0 0 8px;color:#2A2E2A;white-space:pre-wrap}
.doc .rsec p b{color:#1A1D1A}
.doc .rsec .nr{font-style:italic;color:#8B9083}
#toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--green-ink);color:#EAEFDD;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);animation:tin .25s;max-width:380px}
.toast i{color:#8FD0A8}
.toast.err i{color:#E8A79A}
@keyframes tin{from{opacity:0;transform:translateY(12px)}}
.crash{background:var(--danger-bg);border:1px solid #D8B4AB;border-radius:12px;padding:18px 22px;margin-top:18px;color:#6B2A1E;font-size:13.5px}
.secbox{display:flex;gap:12px;align-items:center;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:10px;padding:12px 15px;margin-bottom:16px;font-size:12.5px;color:#5F4318}
.secbox i{color:var(--amber);font-size:15px}
.alnk{background:none;border:0;padding:0;color:var(--green);font-weight:600;cursor:pointer;font-family:var(--sans);font-size:inherit;text-decoration:underline;text-underline-offset:3px}
.alnk:hover{color:var(--green2)}
.feopt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--sans);transition:border-color .15s,background .15s}
.feopt:hover{border-color:var(--green-line);background:var(--green-soft)}
.feopt b{display:block;font-size:13px;color:var(--ink);line-height:1.35}
.feopt small{display:block;margin-top:4px;font-size:11.5px;color:var(--ink2)}
input[type=checkbox]{accent-color:var(--green)}
@page{margin:14mm}
@media print{
  body.printing #app,body.printing #toasts{display:none!important}
  body.printing{background:#fff}
  body.printing #printModal{display:block;position:static;padding:0;background:#fff;backdrop-filter:none}
  body.printing .pwrap{width:100%;box-shadow:none;background:#fff;border-radius:0}
  body.printing .pacts,body.printing .pbody{display:none!important}
  body.printing .doc{padding:0}
}
@media (max-width:1000px){
  #sidebar{width:64px}
  #sidebar .brand-row h1,#sidebar .nav-item span,#sidebar .side-foot{display:none}
  .brand{padding:20px 11px}
  .nav-item{justify-content:center}
  #view{padding:22px 18px 60px}
  .qrow{grid-template-columns:1fr}
  .meta-box,.steps{grid-template-columns:1fr 1fr}
}
</style>
</head>
